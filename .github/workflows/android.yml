name: Android CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: 'Run Android 35 device tests (needed for tagged releases)'
        type: boolean
        default: false
      publish_tag:
        description: 'Optional existing tag to publish, e.g. v1.5.0'
        required: false
        type: string
      inspect_run_id:
        description: 'Optional CI run whose device test failure details should be printed'
        required: false
        type: string
      build_run_id:
        description: 'Successful Android CI run for that exact tag commit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.publish_tag && format('release-{0}', inputs.publish_tag) || inputs.inspect_run_id && format('inspect-{0}', inputs.inspect_run_id) || github.event_name == 'workflow_dispatch' && !inputs.run_device_tests && format('preview-{0}', github.ref_name) || format('ci-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ !inputs.publish_tag }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.run_device_tests && inputs.publish_tag == '' && inputs.inspect_run_id == '')
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify release publication guards
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Build debug, verify tests and lint, and shrink release
        run: ./gradlew --no-daemon --continue --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify minimal APK permissions
        run: python3 .github/scripts/verify-permissions.py
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WebShortcuts-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: WebShortcuts-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Sign release APK if signing secret is configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 .github/scripts/publish-release.py sign
      - name: Upload release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: WebShortcuts-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30

  preview:
    name: Build coexistable preview APK
    if: github.event_name == 'workflow_dispatch' && !inputs.run_device_tests && inputs.publish_tag == '' && inputs.inspect_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build the R8 preview
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assemblePreview
      - name: Sign the preview APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: webshortcuts-preview
        run: python3 .github/scripts/publish-release.py sign-preview
      - uses: actions/upload-artifact@v4
        with:
          name: WebShortcuts-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 30

  device-tests:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_device_tests && inputs.publish_tag == '' && inputs.inspect_run_id == '')
    name: Android 35 device tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Reserve disk space for the emulator
        run: |
          # This Kotlin-only project does not use the runner's preinstalled native toolchains.
          sudo rm -rf "${ANDROID_HOME:?}/ndk" "${ANDROID_HOME:?}/cmake"
          df -h /
      - name: Build app and instrumentation APKs before starting the emulator
        run: ./gradlew --daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the Android 15 system image if cached
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-35/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-api35-google-apis-x86_64
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: bash .github/scripts/run-device-tests.sh
      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots
          path: device-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30

  publish-release:
    name: Publish verified APKs to release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/android-release.yml
    with:
      publish_tag: ${{ inputs.publish_tag }}
      build_run_id: ${{ inputs.build_run_id }}
      inspect_run_id: ${{ inputs.inspect_run_id }}
    secrets: inherit

  inspect-device-tests:
    name: Inspect device test reports
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_run_id != '' && inputs.publish_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.inspect_run_id }}
          name: device-test-reports
          path: device-reports
      - name: Print test failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('device-reports').rglob('TEST-*.xml'))
          assert files, 'No JUnit device reports were found'
          for path in files:
              root = ET.parse(path).getroot()
              print(path, root.attrib)
              for test in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for failure in test.findall(kind):
                          print(test.get('classname'), test.get('name'), failure.get('message'))
                          print(failure.text)
          PY
